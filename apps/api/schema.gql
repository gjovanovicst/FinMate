  id: String!
  isActive: Boolean!

  """Inferred from history rather than created by the user (3.3.4)."""
  isDetected: Boolean!

  """EXPENSE or INCOME (I-3)."""
  kind: String!
  merchantId: UUID
  nextOccurrenceOn: LocalDate!

  """Canonical RFC 5545, restricted to the subset the API expands."""
  rrule: String!

  """The next few dates, expanded server-side."""
  upcomingOccurrences: [LocalDate!]!
  updatedAt: DateTime!
}

input RecurringRuleUpdateInput {
  amount: Money
  autoConfirm: Boolean
  categoryId: UUID

  """Detach the Category."""
  clearCategory: Boolean

  """Remove the end date."""
  clearEndsOn: Boolean
  description: String
  endsOn: LocalDate

  """Deactivating keeps the history (docs/02 §4.14)."""
  isActive: Boolean
  rrule: String
  ruleId: UUID!
  startsOn: LocalDate
}

type RecurringSkipModel {
  """
  Why nothing was posted: NOT_DUE, INACTIVE, ENDED or ALREADY_MATERIALISED.
  """
  reason: String!
  ruleId: UUID!
}

type RejectedRowModel {
  clientRowId: String!
  code: CaptureRejectionCode!

  """The input field at fault, when one is nameable."""
  field: String
  message: String!
}

input ResolveReviewItemInput {
  action: ReviewResolveAction!

  """
  Resolve every queued row sharing the same resolved entity AND the same suggestion in one operation (F-08’s power affordance). One decision, one Correction — the peers are an application of that decision, not N decisions.
  """
  applyToSimilar: Boolean! = false

  """Required for `SET_CATEGORY`."""
  categoryId: ID
  id: ID!

  """
  The "Zapamti za ubuduće" checkbox (F-09). Records the Correction either way; a rule is created only when the trigger is a resolved entity and nothing shadows it (docs/06 §5.3).
  """
  rememberForFuture: Boolean! = false
}

type ResolveReviewItemSuccessModel {
  correction: CorrectionModel

  """
  The item refreshed after resolution — null when the action removed it (DELETE, VOID).
  """
  item: ReviewQueueItemModel

  """
  How many rows this resolution actually cleared, including the one acted on. 1 when `applyToSimilar` was not asked for or found no peers.
  """
  resolvedSimilarCount: Int!

  """The blocking-lane count after this resolution — the nav badge."""
  reviewQueueCount: Int!
  ruleCreated: RuleModel
  synthesisedRule: RuleProposalModel
  transaction: TransactionModel
}

"""One losing proposal, for the numbered alternatives in docs/02 §4.6."""
type ReviewCandidateModel {
  categoryId: ID!

  """The **raw** model confidence — recorded, not gated (docs/04 §6.4)."""
  confidence: Float!
}

"""
`RECEIPT_ITEM` is declared in docs/06 §3.2 but needs the receipts module, which is not built.
"""
enum ReviewItemKind {
  TRANSACTION
}

"""
A Transaction awaiting a decision (F-08). It is in the BLOCKING lane: `needs_review = true` because it has no category or a calibrated confidence below 0.60 (invariant I-8).
"""
type ReviewQueueItemModel {
  """Hours since the row was recorded — the queue’s sort key."""
  ageHours: Int!
  candidates: [ReviewCandidateModel!]!

  """
  The calibrated confidence. Null when nothing was recorded, which is not the same as zero.
  """
  confidence: Float
  id: ID!
  kind: ReviewItemKind!
  reason: ReviewReason!

  """
  The category to accept. Null for an uncategorised row — there is nothing to suggest, and inventing one is what the queue exists to avoid.
  """
  suggestedCategoryId: ID
  transaction: TransactionModel!
}

type ReviewQueueItemModelConnection {
  edges: [ReviewQueueItemModelEdge!]!
  pageInfo: PageInfo!

  """
  Total rows matching the filter, ignoring the page window. Useful for "23 transactions" style labels, and cheap because it is a scoped COUNT.
  """
  totalCount: Int!
}

type ReviewQueueItemModelEdge {
  cursor: String!
  node: ReviewQueueItemModel!
}

"""
Why this row is in the blocking lane (invariant I-8): it has no category at all, or its calibrated confidence is below 0.60. The advisory band (0.60–0.89) is never in this queue.
"""
enum ReviewReason {
  LOW_CONFIDENCE
  UNCATEGORISED
}

"""
What the user decided. `SET_CATEGORY` and `ACCEPT_SUGGESTION` are the learning-loop paths — choosing a category records a Correction and can create a rule (ADR-010).
"""
enum ReviewResolveAction {
  ACCEPT_SUGGESTION
  DELETE
  KEEP_AS_IS
  MARK_AS_DUPLICATE
  SET_CATEGORY
  VOID
}

"""
`RECORDED_ASC` (the default) is oldest-recorded first, so no row starves. docs/06 §4.2 also declares CONFIDENCE and AMOUNT sorts; those are **not** implemented, because a keyset page on a non-unique sort key needs a composite cursor and would silently repeat or skip rows.
"""
enum ReviewSort {
  OCCURRED_ASC
  OCCURRED_DESC
  RECORDED_ASC
  RECORDED_DESC
}

type RuleConflictErrorModel {
  code: String!
  conflicting: [RuleConflictModel!]!
  message: String!
  proposal: RuleProposalModel!
}

"""
An existing rule that would win on a proposed rule’s own trigger input — so the proposal would never fire. docs/04 §8.2: offer to edit that rule rather than shadow it, because shadowing rules is how rule sets rot.
"""
type RuleConflictModel {
  """
  The Category the existing rule sets. Equal to `proposedValue` means that rule already covers this input, so the proposal is redundant rather than contradictory.
  """
  existingValue: String

  """
  The condition field the two rules overlap on — `merchant`, `counterparty` or `text`.
  """
  overlappingField: String!

  """Lower wins (docs/04 §5.3.1)."""
  priority: Int!
  proposedValue: String
  ruleId: ID!
  ruleName: String!
}

"""One row of `rules` (docs/06 §5.3)."""
type RuleModel {
  actions: JSON!
  conditions: JSON!

  """
  Rules that would win on this rule’s own witnessed input, so it may never fire. A **witnessed** check, not a general static analysis: it asks the real engine who wins on an input this rule matches, so it cannot drift from runtime behaviour. A rule whose conditions yield no witness reports none.
  """
  conflictsWith: [RuleConflictModel!]!
  createdAt: DateTime!

  """Count of committed Transactions this rule decided, as a string."""
  hitCount: String!
  id: ID!
  isActive: Boolean!

  """
  `hitCount = 0` and older than 90 days (docs/04 §8.2). Surfaced so the user can prune; the rule itself is never auto-deleted.
  """
  isStale: Boolean!
  lastHitAt: DateTime
  name: String!
  origin: RuleOrigin!

  """Lower wins."""
  priority: Int!
  sourceCorrectionId: ID

  """The first matching stop rule is the decision (docs/04 §5.3.2)."""
  stopOnMatch: Boolean!
  updatedAt: DateTime!
}

"""
`LEARNED` means the product proposed it from a correction and the user accepted (ADR-010); a `LEARNED` rule is never presented as one the user wrote.
"""
enum RuleOrigin {
  IMPORT
  LEARNED
  SYSTEM
  USER
}

input RuleOverrideInput {
  actions: JSON
  conditions: JSON
  isActive: Boolean
  name: String
  priority: Int
  stopOnMatch: Boolean
}

"""
A candidate rule, derived from a correction and **not yet saved** (docs/04 §8.1).
"""
type RuleProposalModel {
  """`{ setCategoryId, setMerchantId, addTagIds, setDescription }`."""
  actions: JSON!

  """A condition tree: `{ all: [{ field, op, value }] }`."""
  conditions: JSON!

  """
  How much the trigger is worth trusting, `0..1`. Derived (docs/04 gives no numbers): a resolved entity is a fact about the user’s data, a text token is a guess about their wording. Used for ordering and explanation only — nothing auto-applies.
  """
  confidence: Float!

  """
  A safe English sentence, per docs/06 §5.3. The client should prefer `explanationCode` so the proposal reads in the user’s language.
  """
  explanation: String!

  """
  A stable code (`RULE_SYNTH_*`) the client localises. Additive to the SDL; see the module note.
  """
  explanationCode: String!
  name: String!
  origin: RuleOrigin!

  """
  Lower wins. Learned rules share the user tier and are ordered by specificity.
  """
  priority: Int!
  trigger: RuleSynthesisTrigger!
}

"""
What the proposal was derived from, narrowest first. `REPEATED_MERCHANT_CORRECTION` is advice to change that Merchant’s default instead of adding a fourth rule (docs/04 §8.2).
"""
enum RuleSynthesisTrigger {
  CONTRADICTS_EXISTING_RULE
  COUNTERPARTY_RESOLVED
  DISTINCTIVE_TOKEN
  MERCHANT_RESOLVED
  REPEATED_MERCHANT_CORRECTION
}

input SavingGoalCreateInput {
  accountId: UUID
  name: String!

  """
  The target. The currency must be the Household ledger currency (ADR-011).
  """
  target: Money!
  targetDate: LocalDate
}

"""
A target amount by a target date, with its contributions. Progress is the sum of the contributions — **not** of Transactions (docs/02 §4.13) — so nothing here talks to the ledger.
"""
type SavingGoalModel {
  """Null when the Account was archived or removed."""
  account: Account

  """The Account the goal is set aside in."""
  accountId: UUID

  """Σ contributions, computed on read."""
  contributed: Money!

  """Newest first."""
  contributions: [GoalContributionModel!]!
  createdAt: DateTime!
  id: String!

  """
  Whole months to the target month. Null when there is no target date; 0 means "due now".
  """
  monthsRemaining: Int
  name: String!

  """0…1, capped so a bar cannot be more than full."""
  progress: Float!

  """target − contributed, never negative."""
  remaining: Money!

  """
  What to put aside each month from now on, rounded **up** so the plan reaches the target. Null only when the goal has no target date; when the date has passed it is the whole remainder.
  """
  requiredPerMonth: Money
  status: GoalStatus!
  target: Money!

  """Null for a goal with no deadline."""
  targetDate: LocalDate
  updatedAt: DateTime!
}

input SavingGoalUpdateInput {
  accountId: UUID

  """Detach the Account."""
  clearAccount: Boolean

  """
  Remove the target date. An absent `targetDate` leaves it unchanged (docs/06 §5.6).
  """
  clearTargetDate: Boolean
  goalId: String!
  name: String

  """
  Archive or restore a goal. ACHIEVED is recomputed from the contributions either way.
  """
  status: GoalStatus
  target: Money
  targetDate: LocalDate
}

type SkippedRowModel {
  clientRowId: String!
  reason: String!
}

"""
One bucket of the spend series. Every bucket of the range is present, empty ones included.
"""
type SpendBucketModel {
  bucketEnd: LocalDate!
  bucketStart: LocalDate!

  """Confirmed expense only (I-3, I-7)."""
  expenseTotal: Money!
  incomeTotal: Money!

  """
  Transactions in the bucket. A split Transaction is counted once, on its parent’s day (I-1).
  """
  transactionCount: Int!
}

"""
One portion of a split. The amounts across all splits must sum EXACTLY to the transaction amount (invariant I-1).
"""
input SplitInput {
  amount: Money!
  categoryId: ID!
  note: String
}

"""
A portion of a Transaction attributed to a different Category. Splits must sum exactly to the parent amount (invariant I-1) — the allocation algorithm guarantees it.
"""
type SplitModel {
  amount: Money!
  categoryId: ID!
  categorySource: CategorySource
  confidence: Float
  id: ID!
  note: String
}

"""What seeding the starter tree did. Idempotent, so `reused` matters."""
type StarterSeedResultModel {
  """Categories created by this call."""
  categories: Int!

  """Category keywords created by this call."""
  keywords: Int!

  """
  Nodes that already existed and were reused — the evidence a second run is a no-op.
  """
  reused: Int!
}

"""
A free-form label orthogonal to Categories (docs/01 F-12). Never affects a budget or a balance — a Tag is a second axis for filtering, not a classification.
"""
type TagModel {
  """
  A CSS colour for the chip, chosen by the user. Never interpreted by the server.
  """
  color: String
  createdAt: DateTime!
  id: String!
  name: String!

  """
  Non-deleted Transactions in this Household carrying this Tag. Counted through the parent Transaction, because `transaction_tags` carries no `household_id` of its own.
  """
  transactionCount: Float!
}

"""
How the range is divided. DAY, ISO WEEK, calendar MONTH, calendar QUARTER — the boundaries come from @finmate/domain, which is also what labels the axis (docs/06 §4.3).
"""
enum TimeBucket {
  DAY
  MONTH
  QUARTER
  WEEK
}

type TransactionConnection {
  edges: [TransactionModelEdge!]!
  pageInfo: PageInfo!

  """
  Total rows matching the filter, ignoring the page window. Useful for "23 transactions" style labels, and cheap because it is a scoped COUNT.
  """
  totalCount: Int!
}

"""
Direction of money movement. `amount_minor` is ALWAYS non-negative; the direction lives here, never in a sign (ADR-003).
"""
enum TransactionKind {
  EXPENSE
  INCOME
}

type TransactionModel {
  accountId: ID!
  amount: Money!

  """
  The Attachment on this row — a Receipt photo (F-34). Set only by `commitAttachment`, which verifies the upload first; the raw `storage_key` is never exposed, so a client resolves the image through the `attachment` query, whose `downloadUrl` is a short-lived presigned GET.
  """
  attachmentId: UUID
  categoryId: ID
  categorySource: CategorySource

  """Calibrated confidence, not the model’s self-reported number (ADR-009)."""
  confidence: Float
  counterpartyId: ID
  createdAt: DateTime!
  description: String!
  id: ID!
  kind: TransactionKind!
  merchantId: ID

  """
  The BLOCKING review lane only: confidence < 0.60 or no category (invariant I-8). The advisory lane (0.60–0.89) is derived and does not set this.
  """
  needsReview: Boolean!
  note: String
  occurredAt: DateTime!

  """
  The calendar day in the Household timezone. Distinct from occurredAt on purpose: month boundaries are a local-calendar question (docs/03 §3.2).
  """
  occurredLocalDate: LocalDate!

  """The verbatim natural-language input."""
  rawInput: String

  """
  The RecurringRule that generated this row, when one did (`source: RECURRING`). It is what links a posted bill back to the standing order that produced it (F-16).
  """
  recurringRuleId: UUID
  source: TransactionSource!
  splits: [SplitModel!]!
  status: TransactionStatus!

  """
  Labels attached to this Transaction, orthogonal to its Category (docs/01 F-12). Reached through the parent because `transaction_tags` carries no household_id of its own.
  """
  tags: [TagModel!]!
  updatedAt: DateTime!

  """
  Optimistic concurrency. Send it back on update; a mismatch is a CONFLICT.
  """
  version: Int!
}

type TransactionModelEdge {
  cursor: String!
  node: TransactionModel!
}

enum TransactionSource {
  IMPORT
  MANUAL
  NATURAL_LANGUAGE
  RECEIPT
  RECURRING
}

"""
PENDING rows are invisible to every balance, budget and insight (invariant I-7), so a capture the user has not accepted can never move a number.
"""
enum TransactionStatus {
  CONFIRMED
  PENDING
  VOID
}

"""
A UUID string (any version; the app generates v7 so ids sort by creation time).
"""
scalar UUID

input UpdateReceiptItemInput {
  amount: Money
  categoryId: UUID
  clearCategory: Boolean
  quantity: Float
  rawText: String
  receiptItemId: UUID!
}