"""
The ways out of a mismatch. `DETACH_TRANSACTION` unlinks a Receipt from its Transaction without deleting the Transaction — a confirmed row of the Household’s money is not removed because a photo was detached.
"""
enum ReconcileAction {
  ACCEPT_MATCH
  ADD_ROUNDING_LINE
  ADJUST_ITEM
  ADJUST_TOTAL
  DETACH_TRANSACTION
}

input ReconcileReceiptInput {
  absorbCategoryId: UUID
  action: ReconcileAction!
  adjustmentItemId: UUID

  """
  The new **absolute** amount for ADJUST_ITEM / ADJUST_TOTAL. Deliberately not a delta: `Money` is non-negative (ADR-003), so a delta could never express a decrease — §5.9 sketched one and that was a defect, recorded in the implementation notes.
  """
  amount: Money
  receiptId: UUID!
}

"""
I-6: `MATCHED` only when the items sum to the total within one minor unit. `MANUAL` means the agreement came from a hand-added line, not from the receipt itself.
"""
enum ReconciliationState {
  MANUAL
  MATCHED
  MISMATCH
  PENDING
}

