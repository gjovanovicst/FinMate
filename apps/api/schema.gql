}

"""
A just-written row that looks like a repeat of an existing Transaction (docs/06 §5.2.2). The advisory third mechanism: the row IS written, because the user may legitimately have bought the same thing twice. Blocking a real second purchase is a worse failure than showing an unwanted chip, so this never refuses anything — it only tells the client to offer an undo.
"""
type DuplicateSuspectModel {
  """The row of THIS commit that looks like a repeat."""
  clientRowId: String!

  """The earlier Transaction it resembles."""
  existingTransaction: TransactionModel!
  existingTransactionId: ID!

  """
  Which rules matched: `amount`, `date`, and `merchant` and/or `description` (docs/06 §5.2.2). `amount` and `date` are always present — they are hard requirements.
  """
  matchedOn: [String!]!

  """
  Folded-description trigram similarity, `0..1`. Reported honestly even for a merchant match, where the two baskets may be nothing alike — that is the case worth a glance.
  """
  similarity: Float!

  """The Transaction just written — what an undo would remove."""
  transactionId: ID!
}

"""
`PENDING` until `commitAttachment` has seen the bytes. `CLEAN`/`SKIPPED` are downloadable — and `SKIPPED` means **not scanned**, which this build produces when no scanner is configured (docs/08 §9.4). `INFECTED`/`FAILED` are never downloadable.
"""
enum FileScanState {
  CLEAN
  FAILED
  INFECTED
  PENDING
  SKIPPED
}

"""
Direction as the parser read it. `UNKNOWN` means no direction signal at all, and `needsDirectionConfirmation` marks a refund/storno word where the sign must be asked about rather than guessed (docs/04 §3.1).
