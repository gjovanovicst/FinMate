    """
    `false` ⇒ rules and keywords only, no egress. The user-level consent switch (docs/08 §6.7).
    """
    allowAi: Boolean

    """Defaults to the Household locale."""
    locale: String

    """Defaults to now."""
    occurredAt: DateTime

    """
    The Household local day, when the client knows it. Derived from the instant and the Household timezone otherwise (docs/03 §3.2).
    """
    occurredLocalDate: LocalDate

    """
    One or more fragments separated by comma, `;`, newline, `+`, ` i ` or ` pa ` — `Lidl 2000, gorivo 3500, plata 150000` is three fragments (docs/04 §3).
    """
    text: String!
  ): CaptureParseResultModel!

  """
  Mark onboarding complete and stamp the time. Separate from `setOnboardingStep` so completion is a fact of its own rather than an inference from reaching step 7.
  """
  completeOnboarding: OnboardingStateModel!

  """
  Correct one property of a Transaction and record the correction as a learning signal (docs/06 §5.3, F-09). The change is applied first and the Correction second, so a Correction never describes a change that did not happen. `synthesisedRule` is always returned when one can be derived, so the UI can offer "Zapamti za ubuduće"; a rule is created here only when `rememberForFuture` is true, the trigger is a resolved entity, and nothing shadows it.
  """
  correctTransaction(input: CorrectTransactionInput!): CorrectTransactionSuccessModel!

  """
  Create an Account. The currency is the Household ledger currency (ADR-011).
  """
  createAccount(
    kind: AccountKind!
    name: String!

    """
    Optional starting balance. Defaults to 0 in the Household ledger currency.
    """
    openingBalance: Money
  ): Account!
  createCategory(
    """A user-authored hint passed to the classifier (docs/04 §6.3)."""
    aiDescription: String
    color: String
    icon: String
    kind: CategoryKind!
    name: String!
    parentId: ID
  ): CategoryModel!

  """
  A name that folds to an existing one is refused with CONFLICT: "Dejan rođa" and "dejan roda" are one person (docs/01 F-11).
  """
  createCounterparty(
    defaultCategoryId: ID
    name: String!
    note: String

    """Defaults to `PERSON`, which is what F-11 is about ("Dejan rođa")."""
    type: CounterpartyType
  ): CounterpartyModel!
  createMerchant(
    """
    A user-authored hint for the classifier. Receipt-item classification outranks it.
    """
    aiHint: String
    defaultCategoryId: ID
    name: String!
  ): MerchantModel!

  """
  Save a rule. The document is validated by the rules engine, so an unevaluable rule is refused here rather than silently skipped on every future parse.
  """
  createRule(
    """
    `{ setCategoryId, setMerchantId, setCounterpartyId, setDescription, addTagIds }`.
    """
    actions: JSON!

    """
    A condition tree: `{ all: [{ field, op, value }] }`. Validated by the rules engine before it is stored, so a rule this API accepts is one the pipeline can evaluate.
    """
    conditions: JSON!
    isActive: Boolean
    name: String!

    """
    Lower wins. Defaults to 100, the same tier a learned rule uses (docs/04 §5.3.1).
    """
    priority: Int
    stopOnMatch: Boolean
  ): RuleModel!

  """
  Save the rule a correction proposed (docs/06 §5.4). Without `overrides` the product’s own proposal is saved, and a proposal that would be shadowed is refused with the conflicting rules so the UI can offer to edit the winner instead (docs/04 §8.2). With `overrides` the user has authored the rule, so it is saved and any conflict is recorded on the result.
  """
  createRuleFromCorrection(input: CreateRuleFromCorrectionInput!): CreateRuleFromCorrectionResult!

  """
  A name that folds to an existing one is refused with CONFLICT: `#Vanredno` and `#vanredno` are one label.
  """
  createTag(
    """A CSS colour for the chip."""
    color: String
    name: String!
  ): TagModel!
  createTransaction(
    accountId: ID!

    """Always positive. `kind` carries the direction, never a sign (ADR-003)."""
    amount: Money!
    categoryId: ID
    counterpartyId: ID
    description: String!

    """
    Makes the write idempotent: replaying the same key returns the original row instead of creating a second one (invariant I-10).
    """
    idempotencyKey: String
    kind: TransactionKind!
    merchantId: ID
    note: String
    occurredAt: DateTime

    """
    The calendar day the user picked. Preferred over occurredAt for date-only entry: the server derives a stable instant, so a client never has to know the Household timezone (I-2).
    """
    occurredLocalDate: LocalDate

    """
    Divide the amount across categories. Must sum EXACTLY to `amount` (invariant I-1); use `proposeSplits` to allocate without losing a para.
    """
    splits: [SplitInput!]

    """
    Tags to attach (docs/01 F-12). Optional, so every existing caller keeps working. An id that is not a Tag of this Household is a VALIDATION_FAILED, never a silent no-op.
    """
    tagIds: [ID!]
  ): TransactionModel!
  deleteBudget(id: ID!): Boolean!

  """
  Soft-delete a category. Refused while transactions, splits or subcategories still reference it unless `reassignToId` is given (invariant I-12).
  """
  deleteCategory(id: ID!, reassignToId: ID): Boolean!

  """
  Soft-delete, refusing with CONFLICT while Transactions still reference it. Merging is the reassignment path — there is no "no counterparty" answer for money that changed hands.
  """
  deleteCounterparty(id: ID!): Boolean!

  """
  Soft-delete, refusing while Transactions, Receipts or RecurringRules still reference it. Merging is the reassignment path.
  """
  deleteMerchant(id: ID!): Boolean!

  """
  Soft-delete. A rule is a decision the user made, and F-31 has to be able to explain why a past Transaction was categorised the way it was.
  """
  deleteRule(id: ID!): Boolean!

  """
  Soft-deletes the Tag AND removes its Transaction assignments. Unlike a Merchant or a Category there is nothing to reassign a label to, so the analogue of reassignment is clearing the assignments — a dangling label is worse than a missing one.
  """
  deleteTag(id: ID!): Boolean!

  """
  Soft-delete. Financial rows are never hard-deleted, so history stays auditable.
  """
  deleteTransaction(id: ID!): Boolean!

  """
  Dismiss an insight. Returns null when the id is not this Household's — the scoped predicate is the tenancy check, not a lookup the caller could race.
  """
  dismissInsight(id: String!): InsightModel

  """
  Run the deterministic generators for one period. Idempotent per condition and period, so it is safe to call repeatedly; the `insights.generate` job calls the same service method.
  """
  generateInsights(
    """
    The local day to generate for. Defaults to today in the Household timezone; a past date is how a backfill or a test pins the run.
    """
    asOf: String
  ): InsightGenerationModel!

  """
  Move every Transaction from one counterparty to another, union their aliases, then delete the source. This is how a duplicate created before the fold rule existed is cleaned up.
  """
  mergeCounterparties(
    """The counterparty to fold away."""
    sourceId: ID!

    """The counterparty to keep."""
    targetId: ID!
  ): CounterpartyModel!

  """
  Move every Transaction, Receipt and RecurringRule from one merchant to another, union their aliases, then delete the source.
  """
  mergeMerchants(
    """The merchant to fold away. Must be Household-owned."""
    sourceId: ID!

    """The merchant to keep. May be a shipped one."""
    targetId: ID!
  ): MerchantModel!
  removeCategoryKeyword(keywordId: ID!): Boolean!

  """
  Resolve one queued row (docs/06 §5.5). Choosing a category goes through the correction path, so it records a Correction and can create a rule — the queue is a learning surface, not a dismiss button. Resolving an already-resolved row is a NO-OP rather than a conflict: two devices clearing the same queue is not an error.
  """
  resolveReviewItem(input: ResolveReviewItemInput!): ResolveReviewItemSuccessModel!

  """
  Write the shipped starter category tree and its keywords into this Household (F-13 step 1). One transaction, and idempotent by (parent, name) — a second call reuses what is already there instead of creating a duplicate tree.
  """
  seedStarterCategories: StarterSeedResultModel!
  setCounterpartyAliases(
    """
    The complete alias set, not a delta. Values are folded (lower case, no diacritics) before storage, so what is stored may differ from what was sent. This is the supported way to record a second spelling of one person ("dejan roda" for "Dejan rođa").
    """
    aliases: [String!]!
    counterpartyId: ID!
  ): CounterpartyModel!
  setMerchantAliases(
    """
    The complete alias set, not a delta. Values are folded (lower case, no diacritics) before storage, so what is stored may differ from what was sent.
    """
    aliases: [String!]!
    merchantId: ID!
  ): MerchantModel!

  """
  Record the step to resume at, so a killed app or a closed tab comes back to the same place. Clamped rather than refused: this is progress bookkeeping, and a 500 on "step 8" would be a worse failure than resuming at the last real step.
  """
  setOnboardingStep(step: Int!): OnboardingStateModel!

  """
  Soft-delete the Transactions a capture just wrote — docs/02 §3's undo toast, in ONE call and all-or-nothing, because a toast that only half-applied would leave the user unable to tell which rows survived. Returns how many were actually undone. Never a hard delete: `deleted_at` is set and the row and its audit trail survive (docs/03 §3.4). Ids outside this Household match nothing rather than deleting another Household's rows.
  """
  undoCapture(transactionIds: [ID!]!): Int!
  updateCategory(
    aiDescription: String
    color: String
    icon: String
    id: ID!
    name: String

    """
    Move the category. Cycles and depth-limit breaches are refused (invariant I-11).
    """
    parentId: ID
    sortOrder: Float
  ): CategoryModel!
  updateCounterparty(defaultCategoryId: ID, id: ID!, name: String, note: String, type: CounterpartyType): CounterpartyModel!

  """
  Editing a shipped merchant creates a Household-owned copy and moves this Household’s references onto it, so the platform catalogue is never mutated (seeds are copy-on-write).
  """
  updateMerchant(aiHint: String, defaultCategoryId: ID, id: ID!, name: String): MerchantModel!
  updateRule(actions: JSON, conditions: JSON, id: ID!, isActive: Boolean, name: String, priority: Int, stopOnMatch: Boolean): RuleModel!
  updateTag(color: String, id: ID!, name: String): TagModel!
  updateTransaction(
    amount: Money
    categoryId: ID
    counterpartyId: ID
    description: String
    id: ID!
    merchantId: ID
    note: String
    occurredAt: DateTime

    """
    The calendar day the user picked. Preferred over occurredAt for date-only entry: the server derives a stable instant, so a client never has to know the Household timezone (I-2).
    """
    occurredLocalDate: LocalDate
    status: TransactionStatus

    """
    REPLACES the Tag set when provided; omitted leaves the existing assignments alone, and an empty array removes them all. The unusual shape is deliberate: the same absent-vs-empty distinction the rest of this update uses.
    """
    tagIds: [ID!]

    """
    The version you read. A mismatch is a CONFLICT rather than a silent overwrite.
    """
    version: Int!
  ): TransactionModel!

  """Create or replace the budget for a scope and period."""
  upsertBudget(
    amount: Money!

    """
    Omit for the whole-Household budget, which is what drives safe-to-spend.
    """
    categoryId: ID
    includeSubcategories: Boolean = true
    period: BudgetPeriod!

    """
    Defaults to the first day of the current month in the Household timezone.
    """
    periodStart: LocalDate
    rollover: Boolean = false
  ): BudgetModel!
}

"""
How far through onboarding this Household is, and what it already has. A step past the last one (7) means the wizard finished.
"""
type OnboardingStateModel {
  accounts: Int!
  categories: Int!
  completedAt: DateTime
  keywords: Int!

  """Merchants this Household owns. Global seeds are not counted."""
  merchants: Int!

  """
  The shipped seed version this Household accepted. Null when the starter tree was skipped — which a later release can tell apart from "never asked", unlike counting rows.
  """
  seedVersion: Int

  """The step to resume at: 1–6, or 7 once onboarding is complete."""
  step: Int!
}

type PageInfo {
  """
  Pass as `after` to fetch the next page. Null when there is no next page.
  """
  endCursor: String

  """True when more rows exist after `endCursor`."""
  hasNextPage: Boolean!
}

"""
One classified fragment (docs/06 §5.1). `needsReview` is the BLOCKING lane only — a null category or a calibrated confidence below 0.60 (docs/04 §7, invariant I-8). `advisory` is the derived 0.60–0.89 AI lane, which the nav badge must NOT count.
"""
type ProposalModel {
  """
  The advisory lane: an AI suggestion at 0.60–0.89. Applied and valid, shown on a secondary tab, never counted by the nav badge (docs/04 §7).
  """
  advisory: Boolean!
  alternatives: [AlternativeModel!]!

  """Minor units as a STRING. A JSON number would be a float (ADR-003)."""
  amountMinor: String

  """Everything considered and rejected, with its score or reason."""
  candidates: [AuditCandidateModel!]!
  categoryId: ID

  """
  The CALIBRATED confidence, three decimals — the gate consumes this, never the model’s self-reported number (ADR-009, docs/04 §6.4).
  """
  confidence: Float!
  counterpartyId: ID
  currency: String
  decidedBy: DecidedBy!
  description: String!

  """Echo this back as `acceptedProposalId` on captureCommit."""
  id: ID!
  kind: FragmentKind!

  """The Merchant/Counterparty the decision came from."""
  merchantId: ID

  """
  A refund/storno word was present, so the direction must be asked about rather than guessed (docs/04 §3.1).
  """
  needsDirectionConfirmation: Boolean!

  """The blocking review lane: `confidence < 0.60` OR no category (I-8)."""
  needsReview: Boolean!

  """ISO calendar day, `YYYY-MM-DD`."""
  occurredOn: String

  """Machine-readable reason; the UI localises its own copy."""
  rationale: String!
  rawText: String!

  """The deciding rule, when one did."""
  ruleId: ID

  """Folded content tokens, as the matcher saw them."""
  tokens: [String!]!
}

"""
A split the backend computed, so the client never rounds money itself (ADR-003).
"""
type ProposedSplit {
  amount: Money!
  categoryId: ID!
}

type Query {
  """A single Account by id, scoped to the Household."""
  account(id: String!): Account!

  """
  Accounts in the current Household, newest first, with computed balances.
  """
  accounts(
    """
    Opaque cursor from a previous page’s endCursor. UUIDv7, so it is time-ordered.
    """
    after: String

    """Page size, 1–200. Defaults to 50."""
    first: Int
  ): AccountConnection!

  """
  Budgets with consumption for their CURRENT period. Spend includes splits and the whole Category subtree, and counts only CONFIRMED transactions (invariants I-5, I-7).
  """
  budgets(today: LocalDate): [BudgetModel!]!

  """
  The Household category tree, flat, each node carrying its depth and breadcrumb. Ordered by sortOrder then name.
  """
  categories(kind: CategoryKind): [CategoryModel!]!

  """
  The classification audit trail for one Transaction (F-31): which layer chose the category, with what confidence, and — when a model was involved — which provider and prompt version.
  """
  classificationDecisions(transactionId: ID!): [ClassificationDecisionModel!]!

  """
  The Household’s Counterparties, name-ordered. Keyset-paginated on the UUIDv7 id. There is no global/shareable set: every Counterparty is the Household’s own row.
  """
  counterparties(
    after: String
    first: Int

    """Substring match on the name."""
    search: String
  ): CounterpartyConnection!
  counterparty(id: ID!): CounterpartyModel!

  """
  Every dashboard tile in one round trip. All figures are computed by the backend from the ledger and every input is returned, so the UI can show its working (ADR-001).
  """
  dashboard: DashboardModel!

  """
  The insight feed, newest first, keyset-paged on the UUIDv7 id (docs/06 §4.1).
  """
  insights(
    """Cursor from a previous page (the insight id)."""
    after: String
    filter: InsightFilterInput
    first: Int
  ): InsightConnection!

  """
  The newest few undismissed insights — the dashboard rail (docs/06 §4.1). A limit rather than a page: the rail shows three and has no "next".
  """
  latestInsights(limit: Int = 3): [InsightModel!]!
  merchant(id: ID!): MerchantModel!

  """
  Merchants visible to this Household: its own rows plus the shipped catalogue, own rows first. Keyset-paginated on the UUIDv7 id.
  """
  merchants(
    after: String
    first: Int

    """Substring match on the name."""
    search: String
  ): MerchantConnection!

  """
  How far through onboarding this Household is, and what it already has. The wizard resumes from `step`; the counts let it say what a re-run would do before doing it.
  """
  onboardingState: OnboardingStateModel!

  """
  Split an amount evenly across categories without losing a para. The backend computes it so the client never rounds money (ADR-003); the result sums exactly (invariant I-1).
  """
  proposeEqualSplits(amount: Money!, categoryIds: [ID!]!): [ProposedSplit!]!

  """
  The blocking lane (invariant I-8): Transactions with no category or a calibrated confidence below 0.60, oldest-recorded first so nothing starves. The advisory band is not here — those rows are applied and valid (docs/04 §7).
  """
  reviewQueue(
    """Cursor from a previous page."""
    after: String
    categoryIds: [ID!]

    """Only rows below this calibrated confidence."""
    confidenceBelow: Float
    first: Int
    occurredOnOrAfter: LocalDate
    occurredOnOrBefore: LocalDate
    reason: [ReviewReason!]
    sort: ReviewSort
  ): ReviewQueueItemModelConnection!

  """
  The BLOCKING lane count (invariant I-8) — the nav badge. A scoped COUNT, so the shell can ask on every screen without loading rows.
  """
  reviewQueueCount: Int!
  rule(id: ID!): RuleModel!

  """
  Every rule of this Household, active or not, ordered as the engine evaluates them (`priority ASC`, then newest first). `conflictsWith` is computed by running the real engine on an input each rule matches, so it cannot disagree with what the pipeline will do.
  """
  rules: [RuleModel!]!
  tag(id: ID!): TagModel

  """
  Every Tag in the Household, name-ordered. Not paginated: the transaction editor needs the whole set to render a chip picker, and a Household has tens of Tags rather than thousands.
  """
  tags: [TagModel!]!
  transaction(id: ID!): TransactionModel!

  """Transactions, newest first, keyset-paginated on the UUIDv7 id."""
  transactions(
    accountId: ID

    """Cursor from a previous page."""
    after: String
    categoryId: ID
    first: Int

    """Inclusive lower bound."""
    from: LocalDate
    kind: TransactionKind

    """Filter to the BLOCKING review lane only (invariant I-8)."""
    needsReview: Boolean

    """Substring match on the description."""
    search: String
    status: TransactionStatus

    """Inclusive upper bound."""
    to: LocalDate
  ): TransactionConnection!
}

type RejectedRowModel {
  clientRowId: String!
  code: CaptureRejectionCode!

  """The input field at fault, when one is nameable."""
  field: String
  message: String!
}

input ResolveReviewItemInput {
  action: ReviewResolveAction!

  """
  Resolve every queued row sharing the same resolved entity AND the same suggestion in one operation (F-08’s power affordance). One decision, one Correction — the peers are an application of that decision, not N decisions.
  """
  applyToSimilar: Boolean! = false

  """Required for `SET_CATEGORY`."""
  categoryId: ID
  id: ID!

  """
  The "Zapamti za ubuduće" checkbox (F-09). Records the Correction either way; a rule is created only when the trigger is a resolved entity and nothing shadows it (docs/06 §5.3).
  """
  rememberForFuture: Boolean! = false
}

type ResolveReviewItemSuccessModel {
  correction: CorrectionModel

  """
  The item refreshed after resolution — null when the action removed it (DELETE, VOID).
  """
  item: ReviewQueueItemModel

  """
  How many rows this resolution actually cleared, including the one acted on. 1 when `applyToSimilar` was not asked for or found no peers.
  """
  resolvedSimilarCount: Int!

  """The blocking-lane count after this resolution — the nav badge."""
  reviewQueueCount: Int!
  ruleCreated: RuleModel
  synthesisedRule: RuleProposalModel
  transaction: TransactionModel
}

"""One losing proposal, for the numbered alternatives in docs/02 §4.6."""
type ReviewCandidateModel {
  categoryId: ID!

  """The **raw** model confidence — recorded, not gated (docs/04 §6.4)."""
  confidence: Float!
}

"""
`RECEIPT_ITEM` is declared in docs/06 §3.2 but needs the receipts module, which is not built.
"""
enum ReviewItemKind {
  TRANSACTION
}

"""
A Transaction awaiting a decision (F-08). It is in the BLOCKING lane: `needs_review = true` because it has no category or a calibrated confidence below 0.60 (invariant I-8).
"""
type ReviewQueueItemModel {
  """Hours since the row was recorded — the queue’s sort key."""
  ageHours: Int!
  candidates: [ReviewCandidateModel!]!

  """
  The calibrated confidence. Null when nothing was recorded, which is not the same as zero.
  """
  confidence: Float
  id: ID!
  kind: ReviewItemKind!
  reason: ReviewReason!

  """
  The category to accept. Null for an uncategorised row — there is nothing to suggest, and inventing one is what the queue exists to avoid.
  """
  suggestedCategoryId: ID
  transaction: TransactionModel!
}

type ReviewQueueItemModelConnection {
  edges: [ReviewQueueItemModelEdge!]!
  pageInfo: PageInfo!

  """
  Total rows matching the filter, ignoring the page window. Useful for "23 transactions" style labels, and cheap because it is a scoped COUNT.
  """
  totalCount: Int!
}

type ReviewQueueItemModelEdge {
  cursor: String!
  node: ReviewQueueItemModel!
}

"""
Why this row is in the blocking lane (invariant I-8): it has no category at all, or its calibrated confidence is below 0.60. The advisory band (0.60–0.89) is never in this queue.
"""
enum ReviewReason {
  LOW_CONFIDENCE
  UNCATEGORISED
}

"""
What the user decided. `SET_CATEGORY` and `ACCEPT_SUGGESTION` are the learning-loop paths — choosing a category records a Correction and can create a rule (ADR-010).
"""
enum ReviewResolveAction {
  ACCEPT_SUGGESTION
  DELETE
  KEEP_AS_IS
  MARK_AS_DUPLICATE
  SET_CATEGORY
  VOID
}

"""
`RECORDED_ASC` (the default) is oldest-recorded first, so no row starves. docs/06 §4.2 also declares CONFIDENCE and AMOUNT sorts; those are **not** implemented, because a keyset page on a non-unique sort key needs a composite cursor and would silently repeat or skip rows.
"""
enum ReviewSort {
  OCCURRED_ASC
  OCCURRED_DESC
  RECORDED_ASC
  RECORDED_DESC
}

type RuleConflictErrorModel {
  code: String!
  conflicting: [RuleConflictModel!]!
  message: String!
  proposal: RuleProposalModel!
}

"""
An existing rule that would win on a proposed rule’s own trigger input — so the proposal would never fire. docs/04 §8.2: offer to edit that rule rather than shadow it, because shadowing rules is how rule sets rot.
"""
type RuleConflictModel {
  """
  The Category the existing rule sets. Equal to `proposedValue` means that rule already covers this input, so the proposal is redundant rather than contradictory.
  """
  existingValue: String

  """
  The condition field the two rules overlap on — `merchant`, `counterparty` or `text`.
  """
  overlappingField: String!

  """Lower wins (docs/04 §5.3.1)."""
  priority: Int!
  proposedValue: String
  ruleId: ID!
  ruleName: String!
}

"""One row of `rules` (docs/06 §5.3)."""
type RuleModel {
  actions: JSON!
  conditions: JSON!

  """
  Rules that would win on this rule’s own witnessed input, so it may never fire. A **witnessed** check, not a general static analysis: it asks the real engine who wins on an input this rule matches, so it cannot drift from runtime behaviour. A rule whose conditions yield no witness reports none.
  """
  conflictsWith: [RuleConflictModel!]!
  createdAt: DateTime!

  """Count of committed Transactions this rule decided, as a string."""
  hitCount: String!
  id: ID!
  isActive: Boolean!

  """
  `hitCount = 0` and older than 90 days (docs/04 §8.2). Surfaced so the user can prune; the rule itself is never auto-deleted.
  """
  isStale: Boolean!
  lastHitAt: DateTime
  name: String!
  origin: RuleOrigin!

  """Lower wins."""
  priority: Int!
  sourceCorrectionId: ID

  """The first matching stop rule is the decision (docs/04 §5.3.2)."""
  stopOnMatch: Boolean!
  updatedAt: DateTime!
}

"""
`LEARNED` means the product proposed it from a correction and the user accepted (ADR-010); a `LEARNED` rule is never presented as one the user wrote.
"""
enum RuleOrigin {
  IMPORT
  LEARNED
  SYSTEM
  USER
}

input RuleOverrideInput {
  actions: JSON
  conditions: JSON
  isActive: Boolean
  name: String
  priority: Int
  stopOnMatch: Boolean
}

"""
A candidate rule, derived from a correction and **not yet saved** (docs/04 §8.1).
"""
type RuleProposalModel {
  """`{ setCategoryId, setMerchantId, addTagIds, setDescription }`."""
  actions: JSON!

  """A condition tree: `{ all: [{ field, op, value }] }`."""
  conditions: JSON!

  """
  How much the trigger is worth trusting, `0..1`. Derived (docs/04 gives no numbers): a resolved entity is a fact about the user’s data, a text token is a guess about their wording. Used for ordering and explanation only — nothing auto-applies.
  """
  confidence: Float!

  """
  A safe English sentence, per docs/06 §5.3. The client should prefer `explanationCode` so the proposal reads in the user’s language.
  """
  explanation: String!

  """
  A stable code (`RULE_SYNTH_*`) the client localises. Additive to the SDL; see the module note.
  """
  explanationCode: String!
  name: String!
  origin: RuleOrigin!

  """
  Lower wins. Learned rules share the user tier and are ordered by specificity.
  """
  priority: Int!
  trigger: RuleSynthesisTrigger!
}

"""
What the proposal was derived from, narrowest first. `REPEATED_MERCHANT_CORRECTION` is advice to change that Merchant’s default instead of adding a fourth rule (docs/04 §8.2).
"""
enum RuleSynthesisTrigger {
  CONTRADICTS_EXISTING_RULE
  COUNTERPARTY_RESOLVED
  DISTINCTIVE_TOKEN
  MERCHANT_RESOLVED
  REPEATED_MERCHANT_CORRECTION
}

type SkippedRowModel {
  clientRowId: String!
  reason: String!
}

"""
One portion of a split. The amounts across all splits must sum EXACTLY to the transaction amount (invariant I-1).
"""
input SplitInput {
  amount: Money!
  categoryId: ID!
  note: String
}

"""
A portion of a Transaction attributed to a different Category. Splits must sum exactly to the parent amount (invariant I-1) — the allocation algorithm guarantees it.
"""
type SplitModel {
  amount: Money!
  categoryId: ID!
  categorySource: CategorySource
  confidence: Float
  id: ID!
  note: String
}

"""What seeding the starter tree did. Idempotent, so `reused` matters."""
type StarterSeedResultModel {
  """Categories created by this call."""
  categories: Int!

  """Category keywords created by this call."""
  keywords: Int!

  """
  Nodes that already existed and were reused — the evidence a second run is a no-op.
  """
  reused: Int!
}

"""
A free-form label orthogonal to Categories (docs/01 F-12). Never affects a budget or a balance — a Tag is a second axis for filtering, not a classification.
"""
type TagModel {
  """
  A CSS colour for the chip, chosen by the user. Never interpreted by the server.
  """
  color: String
  createdAt: DateTime!
  id: String!
  name: String!

  """
  Non-deleted Transactions in this Household carrying this Tag. Counted through the parent Transaction, because `transaction_tags` carries no `household_id` of its own.
  """
  transactionCount: Float!
}

type TransactionConnection {
  edges: [TransactionModelEdge!]!
  pageInfo: PageInfo!

  """
  Total rows matching the filter, ignoring the page window. Useful for "23 transactions" style labels, and cheap because it is a scoped COUNT.
  """
  totalCount: Int!
}

"""
Direction of money movement. `amount_minor` is ALWAYS non-negative; the direction lives here, never in a sign (ADR-003).
"""
enum TransactionKind {
  EXPENSE
  INCOME
}

type TransactionModel {
  accountId: ID!
  amount: Money!
  categoryId: ID
  categorySource: CategorySource

  """Calibrated confidence, not the model’s self-reported number (ADR-009)."""
  confidence: Float
  counterpartyId: ID
  createdAt: DateTime!
  description: String!
  id: ID!
  kind: TransactionKind!
  merchantId: ID

  """
  The BLOCKING review lane only: confidence < 0.60 or no category (invariant I-8). The advisory lane (0.60–0.89) is derived and does not set this.
  """
  needsReview: Boolean!
  note: String
  occurredAt: DateTime!

  """
  The calendar day in the Household timezone. Distinct from occurredAt on purpose: month boundaries are a local-calendar question (docs/03 §3.2).
  """
  occurredLocalDate: LocalDate!

  """The verbatim natural-language input."""
  rawInput: String
  source: TransactionSource!
  splits: [SplitModel!]!
  status: TransactionStatus!

  """
  Labels attached to this Transaction, orthogonal to its Category (docs/01 F-12). Reached through the parent because `transaction_tags` carries no household_id of its own.
  """
  tags: [TagModel!]!
  updatedAt: DateTime!

  """
  Optimistic concurrency. Send it back on update; a mismatch is a CONFLICT.
  """
  version: Int!
}

type TransactionModelEdge {
  cursor: String!
  node: TransactionModel!
}

enum TransactionSource {
  IMPORT
  MANUAL
  NATURAL_LANGUAGE
  RECEIPT
  RECURRING
}

"""
PENDING rows are invisible to every balance, budget and insight (invariant I-7), so a capture the user has not accepted can never move a number.
"""
enum TransactionStatus {
  CONFIRMED
  PENDING
  VOID
}

"""
A UUID string (any version; the app generates v7 so ids sort by creation time).
"""
scalar UUID