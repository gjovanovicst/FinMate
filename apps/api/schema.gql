Which layer produced the category, cheapest first: RULE, KEYWORD, MERCHANT_DEFAULT, COUNTERPARTY_DEFAULT, AI, USER, FALLBACK. The pipeline never guesses: an unavailable model records FALLBACK, never AI (docs/04 §9).
"""
enum DecidedBy {
  AI
  COUNTERPARTY_DEFAULT
  FALLBACK
  KEYWORD
  MERCHANT_DEFAULT
  RULE
  USER
}

"""
How much of the pipeline actually ran. Rules and keywords are untouched by a provider outage, so capture still succeeds — the user can always record a transaction (docs/04 §9).
"""
