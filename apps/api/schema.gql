type Mutation {
  """
  Add an INCLUDE or EXCLUDE keyword. EXCLUDE hard-blocks the category, which is what keeps "ulje" out of Auto/Gorivo (docs/04 §5.4).
  """
  addCategoryKeyword(categoryId: ID!, keyword: String!, matchMode: String = "WORD", polarity: KeywordPolarity!): Boolean!

  """
  Add a line by hand — manual itemisation, and the path when OCR is unavailable.
  """
  addReceiptItem(input: ReceiptItemInput!, receiptId: String!): ReceiptModel!

  """
  Make the selected shipped merchants this Household’s own, with a default Category resolved from the starter tree (F-13 step 4). A merchant already owned is left alone, so re-running never mints a second one.
  """
  applyMerchantSelection(names: [String!]!): MerchantSelectionResultModel!

  """
  The write half of the capture path (docs/06 §5.2). Validates, classifies and writes the whole `rows` array in ONE database transaction: if any row is structurally invalid nothing is written and every offending row is named. A row the confidence gate puts in the blocking lane is NOT a validation failure — it is written PENDING and enters the review queue, so one ambiguous row never blocks a batch (F-06). Idempotent per row via `idempotencyKey` (I-10).
  """
  captureCommit(input: CaptureCommitInput!): CaptureCommitResult!

  """
  Parse and classify without touching the ledger — writes one `classification_decisions` row per fragment for audit and cost (F-07, F-31). Safe to call on every keystroke pause.
  """
  captureParse(
    """
    `false` ⇒ rules and keywords only, no egress. The user-level consent switch (docs/08 §6.7).
    """
    allowAi: Boolean

    """Defaults to the Household locale."""
    locale: String

    """Defaults to now."""
    occurredAt: DateTime

    """
    The Household local day, when the client knows it. Derived from the instant and the Household timezone otherwise (docs/03 §3.2).
    """
    occurredLocalDate: LocalDate

    """
    One or more fragments separated by comma, `;`, newline, `+`, ` i ` or ` pa ` — `Lidl 2000, gorivo 3500, plata 150000` is three fragments (docs/04 §3).
    """
    text: String!
  ): CaptureParseResultModel!

  """
  Verify an uploaded object (size, declared sha256, scan hook) and optionally attach it to a Transaction. Idempotent: a row already decided is linked, not re-scanned.
  """
  commitAttachment(input: CommitAttachmentInput!): AttachmentModel!

  """
  Turn a reconciled receipt into one CONFIRMED Transaction, with a Split per Category. Refused while the receipt does not reconcile (I-6) and while any line has no Category. Idempotent.
  """
  commitReceipt(input: CommitReceiptInput!): ReceiptModel!

  """
  Mark onboarding complete and stamp the time. Separate from `setOnboardingStep` so completion is a fact of its own rather than an inference from reaching step 7.
  """
  completeOnboarding: OnboardingStateModel!

  """
  Accept a proposal: it becomes an ordinary rule and starts posting from its next date.
  """
  confirmDetectedSubscription(ruleId: String!): RecurringRuleModel!

  """
  Put money aside. Idempotent on `idempotencyKey` (invariant I-10): a replay returns the original contribution with `wasReplayed: true` instead of saving it twice.
  """
  contributeToGoal(input: ContributeToGoalInput!): GoalContributionResultModel!

  """
  Correct one property of a Transaction and record the correction as a learning signal (docs/06 §5.3, F-09). The change is applied first and the Correction second, so a Correction never describes a change that did not happen. `synthesisedRule` is always returned when one can be derived, so the UI can offer "Zapamti za ubuduće"; a rule is created here only when `rememberForFuture` is true, the trigger is a resolved entity, and nothing shadows it.
  """
  correctTransaction(input: CorrectTransactionInput!): CorrectTransactionSuccessModel!

  """
  Create an Account. The currency is the Household ledger currency (ADR-011).
  """
  createAccount(
    kind: AccountKind!
    name: String!

    """
    Optional starting balance. Defaults to 0 in the Household ledger currency.
    """
    openingBalance: Money
  ): Account!
  createAlertRule(input: AlertRuleInput!): AlertRuleModel!
  createCategory(
    """A user-authored hint passed to the classifier (docs/04 §6.3)."""
    aiDescription: String
    color: String
    icon: String
    kind: CategoryKind!
    name: String!
    parentId: ID
  ): CategoryModel!

  """
  A name that folds to an existing one is refused with CONFLICT: "Dejan rođa" and "dejan roda" are one person (docs/01 F-11).
  """
  createCounterparty(
    defaultCategoryId: ID
    name: String!
    note: String

    """Defaults to `PERSON`, which is what F-11 is about ("Dejan rođa")."""
    type: CounterpartyType
  ): CounterpartyModel!
  createMerchant(
    """
    A user-authored hint for the classifier. Receipt-item classification outranks it.
    """
    aiHint: String
    defaultCategoryId: ID
    name: String!
  ): MerchantModel!

  """
  Open a Receipt over an uploaded Attachment (docs/09 4.1.2’s upload, this task’s subject). The total is optional: without one the receipt is PENDING rather than mismatched (I-6).
  """
  createReceipt(input: CreateReceiptInput!): ReceiptModel!

  """
  Create a standing order. The schedule is parsed and canonicalised, and an unsupported part is refused rather than ignored. The currency is the Household ledger currency (ADR-011).
  """
  createRecurringRule(input: RecurringRuleCreateInput!): RecurringRuleModel!

  """
  Save a rule. The document is validated by the rules engine, so an unevaluable rule is refused here rather than silently skipped on every future parse.
  """
  createRule(
    """
    `{ setCategoryId, setMerchantId, setCounterpartyId, setDescription, addTagIds }`.
    """
    actions: JSON!

    """
    A condition tree: `{ all: [{ field, op, value }] }`. Validated by the rules engine before it is stored, so a rule this API accepts is one the pipeline can evaluate.
    """
    conditions: JSON!
    isActive: Boolean
    name: String!

    """
    Lower wins. Defaults to 100, the same tier a learned rule uses (docs/04 §5.3.1).
    """
    priority: Int
    stopOnMatch: Boolean
  ): RuleModel!

  """
  Save the rule a correction proposed (docs/06 §5.4). Without `overrides` the product’s own proposal is saved, and a proposal that would be shadowed is refused with the conflicting rules so the UI can offer to edit the winner instead (docs/04 §8.2). With `overrides` the user has authored the rule, so it is saved and any conflict is recorded on the result.
  """
  createRuleFromCorrection(input: CreateRuleFromCorrectionInput!): CreateRuleFromCorrectionResult!

  """
  Create a goal. The currency is the Household ledger currency (ADR-011); the client does not choose it, exactly as for an Account’s opening balance and a Budget’s amount.
  """
  createSavingGoal(input: SavingGoalCreateInput!): SavingGoalModel!

  """
  A name that folds to an existing one is refused with CONFLICT: `#Vanredno` and `#vanredno` are one label.
  """
  createTag(
    """A CSS colour for the chip."""
    color: String
    name: String!
  ): TagModel!
  createTransaction(
    accountId: ID!

    """Always positive. `kind` carries the direction, never a sign (ADR-003)."""
    amount: Money!
    categoryId: ID
    counterpartyId: ID
    description: String!

    """
    Makes the write idempotent: replaying the same key returns the original row instead of creating a second one (invariant I-10).
    """
    idempotencyKey: String
    kind: TransactionKind!
    merchantId: ID
    note: String
    occurredAt: DateTime

    """
    The calendar day the user picked. Preferred over occurredAt for date-only entry: the server derives a stable instant, so a client never has to know the Household timezone (I-2).
    """
    occurredLocalDate: LocalDate

    """
    Divide the amount across categories. Must sum EXACTLY to `amount` (invariant I-1); use `proposeSplits` to allocate without losing a para.
    """
    splits: [SplitInput!]

    """
    Tags to attach (docs/01 F-12). Optional, so every existing caller keeps working. An id that is not a Tag of this Household is a VALIDATION_FAILED, never a silent no-op.
    """
    tagIds: [ID!]
  ): TransactionModel!

  """Returns false when the id is not this Household's rule."""
  deleteAlertRule(id: ID!): Boolean!

  """
  Delete the object and its row. A Transaction or Receipt pointing at it detaches rather than blocking (docs/03 §4). False when the id is not this Household’s.
  """
  deleteAttachment(id: String!): Boolean!
  deleteBudget(id: ID!): Boolean!

  """
  Soft-delete a category. Refused while transactions, splits or subcategories still reference it unless `reassignToId` is given (invariant I-12).
  """
  deleteCategory(id: ID!, reassignToId: ID): Boolean!

  """
  Soft-delete, refusing with CONFLICT while Transactions still reference it. Merging is the reassignment path — there is no "no counterparty" answer for money that changed hands.
  """
  deleteCounterparty(id: ID!): Boolean!

  """Remove a contribution and return the goal with its status recomputed."""
  deleteGoalContribution(id: String!): SavingGoalModel!

  """
  Soft-delete, refusing while Transactions, Receipts or RecurringRules still reference it. Merging is the reassignment path.
  """
  deleteMerchant(id: ID!): Boolean!

  """
  Soft-delete this Household's subscription for an endpoint. False when there is no live row for it here — which is also the answer for another Household's endpoint.
  """
  deletePushSubscription(endpoint: String!): Boolean!

  """
  Soft-delete a rule. The Transactions it posted are kept — they are the ledger.
  """
  deleteRecurringRule(id: String!): Boolean!

  """
  Soft-delete. A rule is a decision the user made, and F-31 has to be able to explain why a past Transaction was categorised the way it was.
  """
  deleteRule(id: ID!): Boolean!

  """
  Soft-delete a goal. Its contributions are kept and become unreachable with it.
  """
  deleteSavingGoal(id: String!): SavingGoalModel!

  """
  Soft-deletes the Tag AND removes its Transaction assignments. Unlike a Merchant or a Category there is nothing to reassign a label to, so the analogue of reassignment is clearing the assignments — a dangling label is worse than a missing one.
  """
  deleteTag(id: ID!): Boolean!

  """
  Soft-delete. Financial rows are never hard-deleted, so history stays auditable.
  """
  deleteTransaction(id: ID!): Boolean!

  """
  Propose the subscriptions hiding in the Household’s own history (F-16, task 3.3.4). Each proposal is stored `isDetected: true, isActive: false`, so it posts nothing until the user accepts it — **propose, never auto-create** (docs/04 §8.2). An identity the Household already rules on, already proposed, or already dismissed is skipped. The `recurring.detect` job calls this same method.
  """
  detectSubscriptions: [RecurringRuleModel!]!

  """
  Dismiss a proposal. It is soft-deleted, so the detector remembers not to propose that identity again — and a rule the Household made is refused rather than quietly removed.
  """
  dismissDetectedSubscription(ruleId: String!): Boolean!

  """
  Dismiss an insight. Returns null when the id is not this Household's — the scoped predicate is the tenancy check, not a lookup the caller could race.
  """
  dismissInsight(id: String!): InsightModel

  """
  The `notifications.dispatch` job (docs/05 §8): deliver what is queued and due — quiet hours re-checked at dispatch time. `IN_APP` rows become SENT (the row is the delivery); `EMAIL` goes through SMTP; `PUSH`/`WEB_PUSH` go to every live browser subscription when VAPID keys are configured, and otherwise stay QUEUED with the reason in `reasons` (ADR-028).
  """
  dispatchNotifications: AlertDispatchModel!

  """
  Read the receipt image and write its lines as items, each categorised by the Household’s own rules. Writes nothing when no OCR provider is configured — the screen then offers manual itemisation instead of a spinner (docs/02 §4.11).
  """
  extractReceipt(receiptId: String!): ReceiptExtractionModel!

  """
  Run the deterministic generators for one period. Idempotent per condition and period, so it is safe to call repeatedly; the `insights.generate` job calls the same service method.
  """
  generateInsights(
    """
    The local day to generate for. Defaults to today in the Household timezone; a past date is how a backfill or a test pins the run.
    """
    asOf: String
  ): InsightGenerationModel!

  """Marks every unread notification read. Returns how many rows changed."""
  markAllNotificationsRead: Int!

  """
  Marks one notification read and returns the new unread count, so the badge never needs a second round trip. Null when the row is not this user's.
  """
  markNotificationRead(id: ID!): NotificationReadModel

  """
  Post every due occurrence (docs/06 §5.8). Idempotent per (rule, occurrence) through the Transactions’ own idempotency key, so a retry cannot double-post; `dryRun` shows what would be written and writes nothing. A rule without `autoConfirm` posts PENDING rows flagged for review.
  """
  materialiseRecurring(input: MaterialiseRecurringInput!): MaterialiseRecurringResultModel!

  """
  Move every Transaction from one counterparty to another, union their aliases, then delete the source. This is how a duplicate created before the fold rule existed is cleaned up.
  """
  mergeCounterparties(
    """The counterparty to fold away."""
    sourceId: ID!

    """The counterparty to keep."""
    targetId: ID!
  ): CounterpartyModel!

  """
  Move every Transaction, Receipt and RecurringRule from one merchant to another, union their aliases, then delete the source.
  """
  mergeMerchants(
    """The merchant to fold away. Must be Household-owned."""
    sourceId: ID!

    """The merchant to keep. May be a shipped one."""
    targetId: ID!
  ): MerchantModel!

  """
  One of the answers to a mismatch. Returns the receipt with its recomputed reconciliation.
  """
  reconcileReceipt(input: ReconcileReceiptInput!): ReceiptModel!

  """
  Grant, decline or withdraw one AI consent purpose. OWNER-only (docs/08 §6.6, Q-11). A withdrawal takes effect before the next AI call.
  """
  recordAiConsent(input: RecordConsentInput!): ConsentModel!

  """
  Register or re-register this browser endpoint for the session's Household and user. `endpoint` is unique, so a re-subscribe updates `lastSeenAt` and revives a retired row rather than duplicating it (ADR-028 decision 3).
  """
  registerPushSubscription(input: PushSubscriptionInput!): PushSubscriptionModel!
  removeCategoryKeyword(keywordId: ID!): Boolean!

  """Remove one line and recompute I-6."""
  removeReceiptItem(receiptItemId: String!): ReceiptModel!

  """
  Resolve one queued row (docs/06 §5.5). Choosing a category goes through the correction path, so it records a Correction and can create a rule — the queue is a learning surface, not a dismiss button. Resolving an already-resolved row is a NO-OP rather than a conflict: two devices clearing the same queue is not an error.
  """
  resolveReviewItem(input: ResolveReviewItemInput!): ResolveReviewItemSuccessModel!

  """
  Generate the period insights, then evaluate them against the Household rules: dedupe, quiet hours and the daily cap are applied, and deliverable notifications are written. Idempotent — the dedupe key is enforced by UNIQUE (user_id, dedupe_key).
  """
  runAlerts(
    """
    The local day to generate and evaluate for. Defaults to today in the Household zone.
    """
    asOf: String
  ): AlertRunModel!

  """
  Write the shipped starter category tree and its keywords into this Household (F-13 step 1). One transaction, and idempotent by (parent, name) — a second call reuses what is already there instead of creating a duplicate tree.
  """
  seedStarterCategories: StarterSeedResultModel!
  setCounterpartyAliases(
    """
    The complete alias set, not a delta. Values are folded (lower case, no diacritics) before storage, so what is stored may differ from what was sent. This is the supported way to record a second spelling of one person ("dejan roda" for "Dejan rođa").
    """
    aliases: [String!]!
    counterpartyId: ID!
  ): CounterpartyModel!
  setMerchantAliases(
    """
    The complete alias set, not a delta. Values are folded (lower case, no diacritics) before storage, so what is stored may differ from what was sent.
    """
    aliases: [String!]!
    merchantId: ID!
  ): MerchantModel!

  """
  Record the step to resume at, so a killed app or a closed tab comes back to the same place. Clamped rather than refused: this is progress bookkeeping, and a 500 on "step 8" would be a worse failure than resuming at the last real step.
  """
  setOnboardingStep(step: Int!): OnboardingStateModel!

  """
  Soft-delete the Transactions a capture just wrote — docs/02 §3's undo toast, in ONE call and all-or-nothing, because a toast that only half-applied would leave the user unable to tell which rows survived. Returns how many were actually undone. Never a hard delete: `deleted_at` is set and the row and its audit trail survive (docs/03 §3.4). Ids outside this Household match nothing rather than deleting another Household's rows.
  """
  undoCapture(transactionIds: [ID!]!): Int!

  """Returns null when the id is not this Household's rule."""
  updateAlertRule(input: AlertRuleUpdateInput!): AlertRuleModel
  updateCategory(
    aiDescription: String
    color: String
    icon: String
    id: ID!
    name: String

    """
    Move the category. Cycles and depth-limit breaches are refused (invariant I-11).
    """
    parentId: ID
    sortOrder: Float
  ): CategoryModel!
  updateCounterparty(defaultCategoryId: ID, id: ID!, name: String, note: String, type: CounterpartyType): CounterpartyModel!

  """
  Editing a shipped merchant creates a Household-owned copy and moves this Household’s references onto it, so the platform catalogue is never mutated (seeds are copy-on-write).
  """
  updateMerchant(aiHint: String, defaultCategoryId: ID, id: ID!, name: String): MerchantModel!

  """
  Merge the given fields into the stored preferences; omitted fields are unchanged.
  """
  updateNotificationPreferences(input: NotificationPreferencesInput!): NotificationPreferencesModel!

  """
  Override one item’s text, amount or category. A category set by hand is recorded at confidence 1 and clears `needsReview`: the user has answered the question the pipeline could not.
  """
  updateReceiptItem(input: UpdateReceiptItemInput!): ReceiptModel!

  """
  Patch a rule. An absent field is left alone; `clearEndsOn`/`clearCategory` unset one. A changed schedule re-anchors `nextOccurrenceOn` from the new start.
  """
  updateRecurringRule(input: RecurringRuleUpdateInput!): RecurringRuleModel!
  updateRule(actions: JSON, conditions: JSON, id: ID!, isActive: Boolean, name: String, priority: Int, stopOnMatch: Boolean): RuleModel!

  """
  Patch a goal. An absent field is left alone; use `clearTargetDate` / `clearAccount` to unset one. `ACHIEVED` is recomputed from the contributions on every write.
  """
  updateSavingGoal(input: SavingGoalUpdateInput!): SavingGoalModel!
  updateTag(color: String, id: ID!, name: String): TagModel!
  updateTransaction(
    amount: Money
    categoryId: ID
    counterpartyId: ID
    description: String
    id: ID!
    merchantId: ID
    note: String
    occurredAt: DateTime

    """
    The calendar day the user picked. Preferred over occurredAt for date-only entry: the server derives a stable instant, so a client never has to know the Household timezone (I-2).
    """
    occurredLocalDate: LocalDate
    status: TransactionStatus

    """
    REPLACES the Tag set when provided; omitted leaves the existing assignments alone, and an empty array removes them all. The unusual shape is deliberate: the same absent-vs-empty distinction the rest of this update uses.
    """
    tagIds: [ID!]

    """
    The version you read. A mismatch is a CONFLICT rather than a silent overwrite.
    """
    version: Int!
  ): TransactionModel!

  """Create or replace the budget for a scope and period."""
  upsertBudget(
    amount: Money!

    """
    Omit for the whole-Household budget, which is what drives safe-to-spend.
    """
    categoryId: ID
    includeSubcategories: Boolean = true
    period: BudgetPeriod!

    """
    Defaults to the first day of the current month in the Household timezone.
    """
    periodStart: LocalDate
    rollover: Boolean = false
  ): BudgetModel!
}

