"""
One classified fragment (docs/06 §5.1). `needsReview` is the BLOCKING lane only — a null category or a calibrated confidence below 0.60 (docs/04 §7, invariant I-8). `advisory` is the derived 0.60–0.89 AI lane, which the nav badge must NOT count.
"""
type ProposalModel {
  """
  The advisory lane: an AI suggestion at 0.60–0.89. Applied and valid, shown on a secondary tab, never counted by the nav badge (docs/04 §7).
  """
  advisory: Boolean!
  alternatives: [AlternativeModel!]!

  """Minor units as a STRING. A JSON number would be a float (ADR-003)."""
  amountMinor: String

  """Everything considered and rejected, with its score or reason."""
  candidates: [AuditCandidateModel!]!
  categoryId: ID

  """
  The CALIBRATED confidence, three decimals — the gate consumes this, never the model’s self-reported number (ADR-009, docs/04 §6.4).
  """
  confidence: Float!
  counterpartyId: ID
  currency: String
  decidedBy: DecidedBy!
  description: String!

  """Echo this back as `acceptedProposalId` on captureCommit."""
