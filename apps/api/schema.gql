  kind: FragmentKind!

  """The Merchant/Counterparty the decision came from."""
  merchantId: ID

  """
  A refund/storno word was present, so the direction must be asked about rather than guessed (docs/04 §3.1).
  """
  needsDirectionConfirmation: Boolean!

  """The blocking review lane: `confidence < 0.60` OR no category (I-8)."""
  needsReview: Boolean!

  """ISO calendar day, `YYYY-MM-DD`."""
  occurredOn: String

  """Machine-readable reason; the UI localises its own copy."""
  rationale: String!
  rawText: String!

  """The deciding rule, when one did."""
