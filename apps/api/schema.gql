type Query {
  """A single Account by id, scoped to the Household."""
  account(id: String!): Account!

  """
  Accounts in the current Household, newest first, with computed balances.
  """
  accounts(
    """
    Opaque cursor from a previous page’s endCursor. UUIDv7, so it is time-ordered.
    """
    after: String

    """Page size, 1–200. Defaults to 50."""
    first: Int
  ): AccountConnection!

  """
  The Household decision for every purpose this build enforces, including the ones never asked. Never a bare boolean: a screen has to be able to say "not asked yet".
  """
  aiConsents: [ConsentModel!]!

  """
  The routes this deployment would use for the consent-governed tasks **something in this build can call**, with the region derived from the endpoint registry. Empty when no endpoint is configured, which is the honest answer: nothing leaves this server and there is nothing to consent to.
  """
  aiEgress: [AiEgressModel!]!

  """
  The Household alert rules, including the documented defaults once anything has run.
  """
  alerts: [AlertRuleModel!]!

  """
  Answer a question about this Household's own ledger. The backend computes the facts; the model only narrates them, and every numeral it writes must exist in `facts` (ADR-017).
  """
  assistantAnswer(locale: String, question: String!): AssistantAnswerModel!

  """
  The answerable starter questions (docs/06 §8.1), for the assistant screen.
  """
  assistantSuggestions: [String!]!

  """One attachment of this Household, or null when the id is not ours."""
  attachment(id: String!): AttachmentModel

  """
  Budgets with consumption for their CURRENT period. Spend includes splits and the whole Category subtree, and counts only CONFIRMED transactions (invariants I-5, I-7).
  """
  budgets(today: LocalDate): [BudgetModel!]!

  """
  What came in, what went out and the signed net, per bucket, over a range.
  """
  cashflow(bucket: TimeBucket!, range: DateRangeInput!): [CashflowBucketModel!]!

  """
  The Household category tree, flat, each node carrying its depth and breadcrumb. Ordered by sortOrder then name.
  """
  categories(kind: CategoryKind): [CategoryModel!]!

  """
  The classification audit trail for one Transaction (F-31): which layer chose the category, with what confidence, and — when a model was involved — which provider and prompt version.
  """
  classificationDecisions(transactionId: ID!): [ClassificationDecisionModel!]!

  """
  The Household’s Counterparties, name-ordered. Keyset-paginated on the UUIDv7 id. There is no global/shareable set: every Counterparty is the Household’s own row.
  """
  counterparties(
    after: String
    first: Int

    """Substring match on the name."""
    search: String
  ): CounterpartyConnection!
  counterparty(id: ID!): CounterpartyModel!

  """
  Every dashboard tile in one round trip. All figures are computed by the backend from the ledger and every input is returned, so the UI can show its working (ADR-001).
  """
  dashboard: DashboardModel!

  """
  The insight feed, newest first, keyset-paged on the UUIDv7 id (docs/06 §4.1).
  """
  insights(
    """Cursor from a previous page (the insight id)."""
    after: String
    filter: InsightFilterInput
    first: Int
  ): InsightConnection!

  """
  The newest few undismissed insights — the dashboard rail (docs/06 §4.1). A limit rather than a page: the rail shows three and has no "next".
  """
  latestInsights(limit: Int = 3): [InsightModel!]!
  merchant(id: ID!): MerchantModel!

  """
  Merchants visible to this Household: its own rows plus the shipped catalogue, own rows first. Keyset-paginated on the UUIDv7 id.
  """
  merchants(
    after: String
    first: Int

    """Substring match on the name."""
    search: String
  ): MerchantConnection!

  """
  One month against another (`YYYY-MM`; `compareTo` defaults to the month before). Each Category carries its baseline figure and a change ratio that is **null when there is nothing to compare against**, which docs/02 §4.15 renders as “nema osnova za poređenje”.
  """
  monthComparison(compareTo: String, period: String!): MonthComparisonModel!

  """
  The Household notification preferences, stored in `households.settings.notifications` (docs/06 §5.14). A malformed or absent document falls back per field, never to an error.
  """
  notificationPreferences: NotificationPreferencesModel!

  """The notification centre, newest first, keyset-paged on the UUIDv7 id."""
  notifications(
    """Cursor from a previous page."""
    after: String
    first: Int
    unreadOnly: Boolean = false
  ): NotificationConnection!

  """
  How far through onboarding this Household is, and what it already has. The wizard resumes from `step`; the counts let it say what a re-run would do before doing it.
  """
  onboardingState: OnboardingStateModel!

  """
  Split an amount evenly across categories without losing a para. The backend computes it so the client never rounds money (ADR-003); the result sums exactly (invariant I-1).
  """
  proposeEqualSplits(amount: Money!, categoryIds: [ID!]!): [ProposedSplit!]!

  """
  The VAPID **public** key the browser needs in order to subscribe, or null when this deployment has not configured a key pair. A public key is not a secret (ADR-028).
  """
  pushPublicKey: String

  """
  One receipt with its items, or null when the id is not this Household’s.
  """
  receipt(id: String!): ReceiptModel

  """The Household’s receipts, newest first, keyset-paged on the UUIDv7 id."""
  receipts(after: String, first: Int): [ReceiptModel!]!

  """
  The Household’s standing orders, soonest next occurrence first. `activeOnly` defaults to true; false lists deactivated and deleted ones too, because deactivating keeps the history.
  """
  recurringRules(activeOnly: Boolean = true): [RecurringRuleModel!]!

  """
  The blocking lane (invariant I-8): Transactions with no category or a calibrated confidence below 0.60, oldest-recorded first so nothing starves. The advisory band is not here — those rows are applied and valid (docs/04 §7).
  """
  reviewQueue(
    """Cursor from a previous page."""
    after: String
    categoryIds: [ID!]

    """Only rows below this calibrated confidence."""
    confidenceBelow: Float
    first: Int
    occurredOnOrAfter: LocalDate
    occurredOnOrBefore: LocalDate
    reason: [ReviewReason!]
    sort: ReviewSort
  ): ReviewQueueItemModelConnection!

  """
  The BLOCKING lane count (invariant I-8) — the nav badge. A scoped COUNT, so the shell can ask on every screen without loading rows.
  """
  reviewQueueCount: Int!
  rule(id: ID!): RuleModel!

  """
  Every rule of this Household, active or not, ordered as the engine evaluates them (`priority ASC`, then newest first). `conflictsWith` is computed by running the real engine on an input each rule matches, so it cannot disagree with what the pipeline will do.
  """
  rules: [RuleModel!]!

  """One goal, or null when the id is not this Household’s."""
  savingGoal(id: String!): SavingGoalModel

  """
  The Household’s goals, oldest first. `status` filters; omitting it (or sending an empty list) returns every status.
  """
  savingGoals(status: [GoalStatus!]): [SavingGoalModel!]!

  """
  Spend per Category over an inclusive range, biggest first, splits included (invariants I-1, I-7). With `includeSubcategories` a Category that has children carries their spend too and `isSubtreeAggregate` says so; the money in no Category is a row with a null `categoryId`, so the leaf rows’ shares add up to the whole range.
  """
  spendByCategory(accountIds: [UUID!], includeSubcategories: Boolean = true, range: DateRangeInput!): [CategorySpendModel!]!

  """
  The spend series over a range, one row per bucket — empty buckets included, so a month with no spending draws a zero rather than a gap. `categoryIds` scopes the series to those Categories’ subtree money, splits included, on the day the receipt was paid.
  """
  spendOverTime(bucket: TimeBucket!, categoryIds: [UUID!], range: DateRangeInput!): [SpendBucketModel!]!
  tag(id: ID!): TagModel

  """
  Every Tag in the Household, name-ordered. Not paginated: the transaction editor needs the whole set to render a chip picker, and a Household has tens of Tags rather than thousands.
  """
  tags: [TagModel!]!

  """
  The biggest Merchants of a range, full Transaction amounts (a split receipt counts under the shop that was paid). A Merchant that was never resolved is listed under its raw description.
  """
  topMerchants(limit: Int = 10, range: DateRangeInput!): [MerchantSpendModel!]!
  transaction(id: ID!): TransactionModel!

  """Transactions, newest first, keyset-paginated on the UUIDv7 id."""
  transactions(
    accountId: ID

    """Cursor from a previous page."""
    after: String
    categoryId: ID
    first: Int

    """Inclusive lower bound."""
    from: LocalDate
    kind: TransactionKind

    """Filter to the BLOCKING review lane only (invariant I-8)."""
    needsReview: Boolean

    """Substring match on the description."""
    search: String
    status: TransactionStatus

    """Inclusive upper bound."""
    to: LocalDate
  ): TransactionConnection!

  """The badge count for the current user."""
  unreadNotificationCount: Int!

  """
  The rules with an occurrence inside the next `withinDays` days — docs/02 §4.14’s "next 30 days" line. A rule with nothing in the window is omitted rather than returned empty.
  """
  upcomingRecurring(withinDays: Int = 30): [RecurringRuleModel!]!
}

