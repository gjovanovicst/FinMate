packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 blocks dependency build scripts by default. Each entry here is a deliberate,
# reviewed exception rather than a blanket "allow all" — an unreviewed install script is a
# supply-chain risk.
#
#   nx                      -> platform-native Nx binary
#   prisma, @prisma/engines -> query/schema engine binaries
#   esbuild                 -> platform-native binary used by tsx (test/tooling scripts)
#   @swc/core               -> platform-native SWC binary; the NestJS dev runtime, because
#                              esbuild cannot emit decorator metadata (see apps/api/project.json)
#   @parcel/watcher         -> native file watching for watch mode
#   unrs-resolver           -> native module resolver used by eslint
allowBuilds:
  nx: true
  prisma: true
  '@prisma/engines': true
  esbuild: true
  '@swc/core': true
  '@parcel/watcher': true
  unrs-resolver: true
