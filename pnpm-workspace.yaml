packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 blocks dependency build scripts by default. Each entry is a deliberate, reviewed
# exception rather than a blanket "allow all" — an unreviewed install script is a supply-chain risk.
#
#   nx                      -> platform-native Nx binary
#   prisma, @prisma/engines -> query/schema engine binaries
#   esbuild                 -> platform-native binary used by tsx (scripts) and Vitest
#   @swc/core               -> platform-native SWC; the NestJS dev runtime and Vitest transform,
#                              because esbuild cannot emit the decorator metadata DI needs (ADR-020)
#   @parcel/watcher         -> native file watching for watch mode
#   unrs-resolver           -> native module resolver used by eslint
#   @apollo/protobufjs      -> generates Apollo Server's usage-reporting protobuf bindings
#   lmdb, msgpackr-extract  -> native deps of the Angular build cache
allowBuilds:
  nx: true
  prisma: true
  '@prisma/engines': true
  esbuild: true
  '@swc/core': true
  '@parcel/watcher': true
  unrs-resolver: true
  '@apollo/protobufjs': true
  lmdb: true
  msgpackr-extract: true

# One instance of a peer-dependent package per workspace, not one per resolution path.
#
# `@nestjs/core` had resolved to **two** physical copies: apps/api and apps/worker each got their own
# `@nestjs/platform-express` chain, so each got its own core. That is fatal for Nest's DI, which
# compares injected tokens by class identity — and the worker loads the API's source through the
# module graph on purpose (ADR-022), so one process holds both copies. Its guards inject `Reflector`,
# and `AuthenticatedGuard`'s constructor metadata pointed at the API's copy while the worker's
# container provided its own: the worker failed to boot with "Nest can't resolve dependencies of the
# AuthenticatedGuard (?) ... in the FilesModule module" — and Nest answers that with `process.abort()`,
# so CI showed only a native stack trace. `dedupePeers` (pnpm 10.33+) collapses the nested peer
# suffixes (`..._@nestjs+core@12.0.1`) that produced the second instance.
dedupePeers: true
